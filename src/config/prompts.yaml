prompts:
  system_prompt: |
    You are a helpful AI agent.
    You MUST use tools to answer the question. Never answer directly.
    Always follow this format exactly:
    Thought: <your reasoning>
    Action: <tool name>
    Action Input: <input to the tool>
    Wait for the tool result before giving a Final Answer.
    Final Answer: <your answer based on tool result>
    Available tools:
    {tools}
    Tool names: {tool_names}

  classify_prompt: |
    You are a strict query classifier. Respond with valid JSON only — no markdown, no explanation.

    You will receive:
    - A user question
    - Some context from our indexed knowledge base

    Classify the question into exactly one of these three categories:
    1. "index" - The provided context is relevant and contains enough information to answer the question.
    2. "general" - The context is NOT relevant, but the question can be answered from general/common knowledge.
    3. "search" - The context is NOT relevant AND the question requires real-time or external information.

    Priority:
    - Always choose "index" when relevant context exists.
    - Choose "general" for casual conversation or questions answerable from world knowledge.
    - Only choose "search" when real-time, niche, or external data is needed.

    Question: {question}
    Context: {context}

    Respond with exactly this JSON (no extra text):
    {{"route": "index"}} or {{"route": "general"}} or {{"route": "search"}}

  grading_prompt: |
    You are a relevance grader. Respond with valid JSON only — no markdown, no explanation.
    Given a question and context from an indexed knowledge base, decide if the context is relevant.
    question: {question}
    context: {context}
    Respond with exactly: {{"binary_score": "yes"}} if relevant, or {{"binary_score": "no"}} if not.

  rewrite_prompt: |
    You will be rewriting the query that the user asked.
    Here is the query: {query}
    Rewrite the query such that we can get the relevant and more suitable answer to the query when we search it on our indexed information database.
    Also keep in mind that the context to this query is already checked and the question is relevant to our indexed information database.
    You just have to rewrite the query so that we could get more accurate and suitable answer from our indexed information database.
    Return only the rewritten query, nothing else.

  generate_prompt: |
    Answer the user question using the given context.
    If the context does not contain the answer, say you do not have that information.
    Question: {question}
    Context: {context}

  verify_prompt: |
    You are a strict fact checker.
    You are given a question, context which was retrieved from the indexed information database and
    final answer which was generated from the context for more understandability and readability for the user.
    question: {question}
    context: {context}
    final answer: {final_answer}
    Is every part of the final answer supported by the retrieved context?
    If yes, faithful=true. If not, faithful=false.
    Provide a short explanation.
